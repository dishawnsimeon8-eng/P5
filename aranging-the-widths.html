<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aranging the widths</title>
    <link rel="stylesheet" href="arangingthewidths.css">
</head>
<body>
    <div class="form-container">
    <p> Rent Audi Vehicles</p>
    <form>
      <label for="name">Named</label>
      <input type="text" id="name" name="name" required placeholder="Enter your name">

      <label for="select">Select</label>
      <select id="subject" name="subject" required>
        <option value="audi">Audi 80</option>
        <option value="audi">Audi 90</option>
        <option value="audi">Audi RS 6</option>
         <option value="audi">Audi S8</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>


    </form>
    
</body>
</html>
